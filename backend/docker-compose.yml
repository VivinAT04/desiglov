services:
  postgres:
    image: postgres:16-alpine
    container_name: desiglov-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: desiglov
      POSTGRES_USER: desiglov
      POSTGRES_PASSWORD: desiglov_local_password

    ports:
      - "5432:5432"

    volumes:
      - desiglov_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U desiglov -d desiglov"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  desiglov_postgres_data:
